; Development-only project for native unit tests. This file is excluded from
; the published library package and is not used by library consumers.

[platformio]
default_envs = native_json
src_dir = src
test_dir = test

[env]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
    +<mqtt_command_decoder.cpp>
lib_deps =
    bblanchon/ArduinoJson@^6.21.6
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++20
    -I src

[env:native_json]

[env:native_msgpack]
build_flags =
    ${env.build_flags}
    -D CONFIG_MSG_PACK_MQTT
