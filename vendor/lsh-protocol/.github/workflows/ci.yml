name: CI & Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      require_current:
        description: "Verify every consumer has adopted this revision"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-generated-shared-doc:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate generated shared documentation
        run: python3 tools/generate_lsh_protocol.py --check

      - name: Check canonical examples, schema and serial frames
        run: |
          python -m pip install "msgpack>=1,<2" "jsonschema>=4,<5"
          python -m unittest discover -s tests

  lint-markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.24.0

  smoke-test-all-target-generators:
    needs: validate-generated-shared-doc
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Smoke-test all generator targets
        run: |
          python3 tools/generate_lsh_protocol.py \
            --target shared-doc \
            --target core \
            --target bridge \
            --target coordinator \
            --shared-doc-root "${RUNNER_TEMP}/shared-doc" \
            --core-root "${RUNNER_TEMP}/lsh-core" \
            --bridge-root "${RUNNER_TEMP}/lsh-bridge" \
            --coordinator-root "${RUNNER_TEMP}/labo-smart-home-coordinator"

  cross-repo-protocol-drift:
    needs: validate-generated-shared-doc
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout protocol
        uses: actions/checkout@v7
        with:
          path: lsh-protocol
          fetch-depth: 0

      - name: Checkout lsh-core
        uses: actions/checkout@v7
        with:
          repository: labodj/lsh-core
          path: lsh-core
          submodules: "recursive"

      - name: Checkout lsh-bridge
        uses: actions/checkout@v7
        with:
          repository: labodj/lsh-bridge
          path: lsh-bridge
          submodules: "recursive"

      - name: Checkout coordinator
        uses: actions/checkout@v7
        with:
          repository: labodj/labo-smart-home-coordinator
          path: labo-smart-home-coordinator

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify consumer input and output hashes
        env:
          REQUIRE_CURRENT: ${{ inputs.require_current }}
        run: |
          args=()
          if [[ "$REQUIRE_CURRENT" != "true" ]]; then args+=(--allow-previous); fi
          python lsh-protocol/tools/check_consumer_drift.py "${args[@]}"

  release:
    needs:
      - validate-generated-shared-doc
      - lint-markdown
      - smoke-test-all-target-generators
      - cross-repo-protocol-drift
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: lsh-protocol ${{ github.ref_name }}
          generate_release_notes: true
